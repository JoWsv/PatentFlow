{% extends 'base.html' %}{% block content %}<div class="top"><div><h1>{{'Editar patente' if pat else 'Cadastrar nova patente'}}</h1><p class="muted">Preencha os campos obrigatórios.</p></div></div><section class="panel"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><div class="formgrid"><div class="field"><label for="numero">Número do processo *</label><input id="numero" name="numero_processo" maxlength="60" required value="{{request.form.get('numero_processo',pat.numero_processo if pat else '')}}"></div><div class="field"><label for="inventor">Inventor *</label><input id="inventor" name="inventor" maxlength="120" required value="{{request.form.get('inventor',pat.inventor if pat else '')}}"></div><div class="field"><label for="instituto">Instituto *</label><input id="instituto" name="instituto" maxlength="120" required value="{{request.form.get('instituto',pat.instituto if pat else '')}}"></div><div class="field"><label for="data">Data de registro *</label><input id="data" name="data_registro" type="date" required value="{{request.form.get('data_registro',pat.data_registro if pat else '')}}"></div><div class="field"><label for="status">Status *</label><select id="status" name="status" required>{% for s in statuses %}<option value="{{s}}" {% if request.form.get('status',pat.status if pat else 'Em andamento')==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></div><div class="field"><label for="custos">Custos (€) *</label><input id="custos" name="custos" type="number" min="0" step="0.01" required value="{{request.form.get('custos',pat.custos if pat else '0')}}"></div></div><div class="actions"><button type="submit">Salvar</button><a class="btn secondary" href="{{url_for('detalhes',pid=pat.id) if pat else url_for('index')}}">Cancelar</a></div></form></section>{% endblock %}
